# ============================================
# DATABASE CONFIGURATION
# ============================================
# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/admas_school_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=teddy127549
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
# Hibernate DDL Auto (create, update, validate, none)
# update: automatically updates schema based on entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# SQL Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# SERVER CONFIGURATION
# ============================================
# Application port
server.port=8080

# Application context path
server.servlet.context-path=/api/v1

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Logging level for your application
logging.level.com.admas.management=DEBUG

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# SPRING BOOT ACTUATOR (Optional)
# ============================================
# Enable health check endpoint
management.endpoints.web.exposure.include=health,info

# ============================================
# FILE UPLOAD CONFIGURATION (For student photos)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JACKSON CONFIGURATION (JSON formatting)
# ============================================
# Date format for JSON responses
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC